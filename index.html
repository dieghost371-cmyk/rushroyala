@theme {
  --font-display: "Segoe UI Black", "Arial Black", system-ui, sans-serif;
  --animate-float: float 4s ease-in-out infinite;
  --animate-pop: pop 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  --animate-rise: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  --animate-shine: shine 2.6s linear infinite;
  --animate-glow: glow 2s ease-in-out infinite;
  --animate-gradient: gradient 6s ease infinite;
  --animate-spin-slow: spin 8s linear infinite;

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes pop {
    0% { transform: scale(2.6); opacity: 0; }
    35% { transform: scale(0.9); opacity: 1; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes rise {
    from { transform: translateY(24px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes shine {
    from { background-position: -200% center; }
    to { background-position: 200% center; }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 18px rgba(0, 229, 255, 0.35), inset 0 0 0 1px rgba(255,255,255,.15); }
    50% { box-shadow: 0 0 36px rgba(255, 61, 245, 0.55), inset 0 0 0 1px rgba(255,255,255,.25); }
  }
  @keyframes gradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
}

html, body {
  height: 100%;
  overscroll-behavior: none;
  background: #07051a;
}
body {
  -webkit-tap-highlight-color: transparent;
}
.game-root, .game-root * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.game-root input {
  -webkit-user-select: text;
  user-select: text;
}
.text-logo {
  font-family: var(--font-display);
  background: linear-gradient(90deg, #00e5ff, #ff3df5, #ffd000, #00e5ff);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 4s linear infinite;
  filter: drop-shadow(0 4px 18px rgba(255, 61, 245, 0.45));
}
.glass {
  background: linear-gradient(160deg, rgba(30, 22, 70, 0.72), rgba(10, 8, 30, 0.78));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.hud-text {
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
}
input[type="range"] {
  accent-color: #ff3df5;
}
.scroll-thin::-webkit-scrollbar { width: 6px; }
.scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }

</style>
